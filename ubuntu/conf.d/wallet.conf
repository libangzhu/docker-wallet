server {
    listen 8082;
    listen [::]:8082;
    root /data/wallet/token_config;
    index index.html index.htm index.nginx-debian.html;
    server_name _;

    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'POST,GET,PUT,DELETE,OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since,FZM-REQUEST-OS,FZM-USER-IP,FZM-REQUEST-UUID,FZM-PLATFORM-ID,Token,lang';
    add_header 'Access-Control-Allow-Credentials' 'true';

    location /admin/assets/ {
        if (!-e $request_filename){
            rewrite ^/admin/assets/(.*) /backend/assets/$1 last;
        }
        try_files $uri $uri/ =404;
    }

    location /admin/upload/ {
        if (!-e $request_filename){
            rewrite ^/admin/upload/(.*) /backend/upload/$1 last;
        }
        try_files $uri $uri/ =404;
    }

    location /admin {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
    }

    location /interface {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /h5 {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    error_log /var/log/nginx/php-wallet.error.log;
    access_log /var/log/nginx/php-wallet.access.log;

    location /goapi {
      proxy_pass http://127.0.0.1:8983/;
    }
}
