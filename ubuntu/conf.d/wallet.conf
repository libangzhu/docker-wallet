server {
    listen 8082;
    listen [::]:8082;
    root /data/wallet/token_config;
    index index.php index.html index.htm index.nginx-debian.html;
    server_name _;

    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'POST,GET,PUT,DELETE,OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since';
    add_header 'Access-Control-Allow-Credentials' 'true';

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param   SCRIPT_FILENAME    $document_root$fastcgi_script_name;
    }

    location /admin {
        if (!-e $request_filename){
            rewrite ^/(.*) /backend/index.php last;
        }
        try_files $uri $uri/ =404;
    }

    location /admin/assets/ {
        if (!-e $request_filename){
            rewrite ^/admin/assets/(.*) /backend/assets/$1 last;
        }
        try_files $uri $uri/ =404;
    }

    location /admin/upload/ {
        if (!-e $request_filename){
            rewrite ^/admin/upload/(.*) /backend/upload/$1 last;
        }
        try_files $uri $uri/ =404;
    }

    location /interface {
        if (!-e $request_filename){
            rewrite ^/(.*) /api/index.php last;
        }
        try_files $uri $uri/ =404;
    }

    location /h5 {
        if (!-e $request_filename){
            rewrite ^/(.*) /h5/index.php last;
        }
        try_files $uri $uri/ =404;
    }

    location /api {
        if (!-e $request_filename){
            rewrite ^/(.*) /wallet/index.php last;
        }
        try_files $uri $uri/ =404;
    }

    error_log /var/log/nginx/php-wallet.error.log;
    access_log /var/log/nginx/php-wallet.access.log;
		
    location /goapi {
      proxy_pass http://127.0.0.1:8983/;
    }
}
